{% extends "carpenter/link_base.html" %}

{% block body %}
<div class="link-card text-center py-5">
    {% if thanks %}
    <i class="bi bi-check-circle text-success" style="font-size:3rem;"></i>
    <h3 class="mt-3">{{ labels.thanks_title }}</h3>
    <p class="text-muted mb-0">{{ labels.thanks_body }}</p>
    {% else %}
    <i class="bi bi-link-45deg text-muted" style="font-size:3rem;"></i>
    <h3 class="mt-3" style="font-size:1.2rem;">{{ labels.closed_title }}</h3>
    <p class="text-muted mb-0">{{ labels.closed_body }}</p>
    {% endif %}
</div>
{% endblock %}
