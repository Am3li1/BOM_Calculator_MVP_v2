{% extends 'base.html' %}
{% block content %}

<div class="mb-3">
    <h5 class="mb-0">Add Customer</h5>
</div>

<div class="content-card" style="max-width:600px;">
    <div class="card-header">Customer Details</div>
    <div class="p-3">
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">

            {% for field in form %}
            <div class="mb-3">
                <label class="form-label small text-muted">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                {% endif %}
            </div>
            {% endfor %}

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary btn-sm">Save Customer</button>
                <a href="{% url 'quotations:customer_list' %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
